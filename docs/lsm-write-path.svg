<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="Writes appended to the WAL and inserted into the skip-list memtable, which freezes at four megabytes and flushes to a new L0 SSTable; once L0 holds four tables the compactor merges them into one L1 table">
  <title>ClatterDB LSM write path: memtable to L0 to L1</title>

  <defs>
    <marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e7681"/>
    </marker>
  </defs>

  <text x="20" y="30" font-family="sans-serif" font-size="17" font-weight="bold" fill="#8b949e">LSM write path</text>
  <text x="20" y="50" font-family="sans-serif" font-size="13" fill="#8b949e">every write is durable in the WAL first, then buffered in the skip list; four flushes fill L0 and trigger a merge into L1</text>

  <!-- write source -->
  <text x="60" y="112" font-family="sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">writes</text>
  <text x="60" y="130" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">(key, ts, value)</text>
  <path id="p1" d="M110,105 L206,105" stroke="#6e7681" stroke-width="1.5" fill="none" marker-end="url(#m1)"/>
  <circle r="5" fill="#58a6ff">
    <animateMotion dur="1.2s" repeatCount="indefinite" path="M110,105 L206,105"/>
  </circle>
  <circle r="5" fill="#58a6ff">
    <animateMotion dur="1.2s" begin="0.4s" repeatCount="indefinite" path="M110,105 L206,105"/>
  </circle>
  <circle r="5" fill="#58a6ff">
    <animateMotion dur="1.2s" begin="0.8s" repeatCount="indefinite" path="M110,105 L206,105"/>
  </circle>

  <!-- WAL -->
  <rect x="210" y="82" width="130" height="48" rx="7" fill="none" stroke="#58a6ff" stroke-width="1.8"/>
  <text x="275" y="104" font-family="sans-serif" font-size="13" fill="#58a6ff" text-anchor="middle">WAL append</text>
  <text x="275" y="121" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">CRC32, 64 MB segments</text>

  <path d="M344,106 L396,106" stroke="#6e7681" stroke-width="1.5" fill="none" marker-end="url(#m1)"/>

  <!-- memtable -->
  <rect x="400" y="74" width="260" height="64" rx="7" fill="none" stroke="#3fb950" stroke-width="1.8"/>
  <text x="530" y="94" font-family="sans-serif" font-size="13" fill="#3fb950" text-anchor="middle">active memtable — skip list, 4 MB cap</text>
  <rect x="414" y="104" width="232" height="22" rx="4" fill="none" stroke="#6e7681" stroke-width="1"/>
  <rect x="415" y="105" width="0" height="20" rx="3" fill="#3fb950" opacity="0.55">
    <animate attributeName="width" values="0;230;0;230;0;230;0;230;0;0" keyTimes="0;0.19;0.20;0.39;0.40;0.59;0.60;0.79;0.80;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <text x="530" y="156" font-family="sans-serif" font-size="12" fill="#d29922" text-anchor="middle">full: freeze, swap in a fresh memtable, flush the frozen one
  </text>

  <!-- flush arrow -->
  <path id="flush" d="M530,164 L530,214" stroke="#6e7681" stroke-width="1.5" fill="none" marker-end="url(#m1)" stroke-dasharray="5 4"/>

  <!-- L0 -->
  <text x="120" y="248" font-family="sans-serif" font-size="14" fill="#8b949e">L0</text>
  <text x="120" y="266" font-family="sans-serif" font-size="12" fill="#8b949e">overlapping key ranges</text>
  <text x="120" y="282" font-family="sans-serif" font-size="12" fill="#8b949e">merge at 4 tables</text>

  <g>
    <rect x="330" y="228" width="90" height="38" rx="6" fill="#3fb950" opacity="0" stroke="#3fb950" stroke-width="1.5">
      <animate attributeName="opacity" values="0;0.4;0.4;0;0" keyTimes="0;0.20;0.86;0.88;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
    </rect>
    <rect x="435" y="228" width="90" height="38" rx="6" fill="#3fb950" opacity="0" stroke="#3fb950" stroke-width="1.5">
      <animate attributeName="opacity" values="0;0.4;0.4;0;0" keyTimes="0;0.40;0.86;0.88;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
    </rect>
    <rect x="540" y="228" width="90" height="38" rx="6" fill="#3fb950" opacity="0" stroke="#3fb950" stroke-width="1.5">
      <animate attributeName="opacity" values="0;0.4;0.4;0;0" keyTimes="0;0.60;0.86;0.88;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
    </rect>
    <rect x="645" y="228" width="90" height="38" rx="6" fill="#d29922" opacity="0" stroke="#d29922" stroke-width="1.5">
      <animate attributeName="opacity" values="0;0.45;0.45;0;0" keyTimes="0;0.80;0.86;0.88;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
    </rect>
    <g font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">
      <text x="375" y="252" opacity="0">L0_1.sst<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.20;0.86;0.88;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
      <text x="480" y="252" opacity="0">L0_2.sst<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.40;0.86;0.88;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
      <text x="585" y="252" opacity="0">L0_3.sst<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.60;0.86;0.88;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
      <text x="690" y="252" opacity="0">L0_4.sst<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.80;0.86;0.88;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
    </g>
  </g>

  <text x="800" y="252" font-family="sans-serif" font-size="13" fill="#d29922" text-anchor="middle" opacity="0">trigger
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.80;0.88;0.90;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
  </text>

  <!-- flying chips memtable to L0 -->
  <g>
    <rect x="-40" y="-16" width="80" height="32" rx="6" fill="#3fb950" opacity="0.6"/>
    <animateMotion dur="12s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.16;0.20;1" calcMode="linear" path="M530,150 C530,180 400,190 375,224"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.16;0.20;0.21;1" dur="12s" repeatCount="indefinite"/>
  </g>
  <g>
    <rect x="-40" y="-16" width="80" height="32" rx="6" fill="#3fb950" opacity="0.6"/>
    <animateMotion dur="12s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.36;0.40;1" calcMode="linear" path="M530,150 C530,180 490,190 480,224"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.36;0.40;0.41;1" dur="12s" repeatCount="indefinite"/>
  </g>
  <g>
    <rect x="-40" y="-16" width="80" height="32" rx="6" fill="#3fb950" opacity="0.6"/>
    <animateMotion dur="12s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.56;0.60;1" calcMode="linear" path="M530,150 C530,180 580,190 585,224"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.56;0.60;0.61;1" dur="12s" repeatCount="indefinite"/>
  </g>
  <g>
    <rect x="-40" y="-16" width="80" height="32" rx="6" fill="#d29922" opacity="0.6"/>
    <animateMotion dur="12s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.76;0.80;1" calcMode="linear" path="M530,150 C530,180 680,190 690,224"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.76;0.80;0.81;1" dur="12s" repeatCount="indefinite"/>
  </g>

  <!-- merge chips into L1 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.86;0.88;0.97;1" dur="12s" repeatCount="indefinite"/>
    <path d="M375,270 L520,332" stroke="#a371f7" stroke-width="1.5" fill="none" marker-end="url(#m1)"/>
    <path d="M480,270 L540,332" stroke="#a371f7" stroke-width="1.5" fill="none" marker-end="url(#m1)"/>
    <path d="M585,270 L580,332" stroke="#a371f7" stroke-width="1.5" fill="none" marker-end="url(#m1)"/>
    <path d="M690,270 L600,332" stroke="#a371f7" stroke-width="1.5" fill="none" marker-end="url(#m1)"/>
  </g>

  <!-- L1 -->
  <text x="120" y="360" font-family="sans-serif" font-size="14" fill="#8b949e">L1</text>
  <text x="120" y="378" font-family="sans-serif" font-size="12" fill="#8b949e">64 MB budget, 10x per level</text>

  <rect x="440" y="338" width="220" height="38" rx="6" fill="#a371f7" opacity="0" stroke="#a371f7" stroke-width="1.5">
    <animate attributeName="opacity" values="0;0.35;0.35;0" keyTimes="0;0.90;0.99;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <text x="550" y="362" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle" opacity="0">L1_1.sst — one sorted run
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.90;0.99;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
  </text>

  <text x="450" y="412" font-family="sans-serif" font-size="13" fill="#a371f7" text-anchor="middle" opacity="0">compactLevel(0): k-way merge by (seriesKey, timestamp), newest txn wins, tombstones dropped
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.86;0.89;0.99;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="450" y="440" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">reads check the memtable, then the immutable memtables, then L0 newest-first, then each level below</text>
  <text x="450" y="460" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">a bloom filter and the footer time range reject most SSTables before any data is read</text>
</svg>
